name: Build index

# Downloads Open India Law central legislation, builds the search index,
# runs the retrieval evaluation, and commits index/ and eval/results.md.
on:
  workflow_dispatch:
  push:
    paths:
      - "praetor/config.py"
      - "praetor/data.py"
      - "praetor/index.py"
      - "eval/questions.jsonl"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - name: Build index
        run: python scripts/build_index.py
      - name: Evaluate retrieval
        run: python scripts/eval_retrieval.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index eval/results.md
          git diff --cached --quiet || git commit -m "Rebuild index [skip ci]"
          git push
